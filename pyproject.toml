[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kreyolbench"
version = "0.1.0"
description = "Kreyol-first Haitian Creole NLP benchmark scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "KreyolBench contributors"}]
dependencies = [
  "datasets>=2.19.0",
  "evaluate>=0.4.2",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.0",
  "rapidfuzz>=3.6.0",
  "scikit-learn>=1.3.0",
  "seqeval>=1.2.2",
  "typer>=0.9.0",
]

[project.optional-dependencies]
preprocessing = ["trafilatura>=1.8.0", "pymupdf>=1.23.0"]
models = ["transformers>=4.40.0", "torch>=2.1.0", "sentence-transformers>=2.6.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "mypy>=1.8.0"]

[project.scripts]
kreyolbench = "kreyolbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

