ontology:
  PER: named person or explicitly named human identity
  ORG: named organization or institution acting as an organization
  LOC: named non-political geographic feature
  GPE: named political or administrative geographic unit
  DATE: calendrical date or named temporal period
  TIME: clock time or bounded time of day
  MONEY: monetary amount including its currency expression
  PERCENT: percentage or explicitly expressed rate
  FACILITY: named physical facility when the physical site is intended
  HEALTH_CONDITION: named disease, syndrome, or reviewed clinical condition
  PRODUCT: named product, medicine, or branded material object
  LAW_POLICY: official title or stable short name of a law, regulation, or policy
  EVENT: named event with a stable referential identity
